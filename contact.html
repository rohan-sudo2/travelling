<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanderlust - Contact</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>
nav {
    backdrop-filter: blur(10px);
}

/* smooth input focus */
input:focus, textarea:focus, select:focus {
    transform: scale(1.02);
    transition: 0.2s;
}
</style>
</head>

<body class="bg-gray-50 font-sans">

<!-- NAVBAR -->
<nav class="bg-white/80 shadow sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 flex justify-between h-16 items-center">

<div class="flex items-center space-x-2">
<i class="fas fa-plane-departure text-blue-500 text-2xl"></i>
<span class="text-xl font-bold text-blue-600">Wanderlust</span>
</div>

<div class="hidden md:flex space-x-6 items-center">
<a href="#" class="hover:text-blue-600">Home</a>
<a href="#" class="hover:text-blue-600">Destinations</a>
<a href="#" class="hover:text-blue-600">Packages</a>
<a href="#" class="hover:text-blue-600">Contact</a>

<button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
Book Now
</button>
</div>

<button id="menuBtn" class="md:hidden text-xl">
<i class="fas fa-bars"></i>
</button>

</div>

<div id="mobileMenu" class="hidden md:hidden bg-white px-4 pb-4">
<a href="#" class="block py-2">Home</a>
<a href="#" class="block py-2">Destinations</a>
<a href="#" class="block py-2">Packages</a>
<a href="#" class="block py-2">Contact</a>
</div>
</nav>

<!-- CONTACT -->
<section class="py-20">
<div class="max-w-7xl mx-auto px-4 grid lg:grid-cols-2 gap-12 items-center">

<!-- LEFT -->
<div>
<h2 class="text-4xl font-bold mb-4">Have Questions?</h2>
<p class="text-gray-500 mb-8">We’ll reply within 24 hours.</p>

<div class="space-y-6">

<div class="flex items-start space-x-4">
<div class="bg-blue-100 p-3 rounded-full">
<i class="fas fa-phone text-blue-600"></i>
</div>
<div>
<p class="font-semibold">Call</p>
<p class="text-gray-500">+1 (555) 123-4567</p>
</div>
</div>

<div class="flex items-start space-x-4">
<div class="bg-blue-100 p-3 rounded-full">
<i class="fas fa-envelope text-blue-600"></i>
</div>
<div>
<p class="font-semibold">Email</p>
<p class="text-gray-500">hello@wanderlust.com</p>
</div>
</div>

<div class="flex items-start space-x-4">
<div class="bg-blue-100 p-3 rounded-full">
<i class="fas fa-map-marker-alt text-blue-600"></i>
</div>
<div>
<p class="font-semibold">Visit</p>
<p class="text-gray-500">San Francisco, CA</p>
</div>
</div>

</div>
</div>

<!-- FORM -->
<div class="bg-white p-8 rounded-2xl shadow-xl">
<form id="contactForm" class="space-y-6">

<input type="text" id="name" placeholder="Full Name"
class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">

<input type="email" id="email" placeholder="Email"
class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">

<input type="tel" id="phone" placeholder="Phone"
class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">

<select id="destination"
class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
<option value="">Select Destination</option>
<option>Bali</option>
<option>Santorini</option>
<option>Kyoto</option>
<option>Paris</option>
</select>

<textarea id="message" rows="4" placeholder="Your message..."
class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>

<button class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
Send Message
</button>

<p id="successMsg" class="hidden text-green-600 text-center">
✅ Message sent successfully!
</p>

</form>
</div>

</div>
</section>

<!-- FOOTER -->
<footer class="bg-gray-900 text-gray-400 py-10 text-center">
<h3 class="text-white font-bold text-lg">Wanderlust</h3>
<p class="mt-2">Travel made beautiful.</p>
<p class="mt-4 text-sm">© 2026 Wanderlust</p>
</footer>

<script>
// mobile menu
document.getElementById("menuBtn").onclick = () => {
    document.getElementById("mobileMenu").classList.toggle("hidden");
};

// form validation
document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!name || !email || !message) {
        alert("Please fill all required fields.");
        return;
    }

    document.getElementById("successMsg").classList.remove("hidden");
    this.reset();
});
</script>

</body>
</html>
